<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>החלפת גז סודהסטרים</title>
  <meta name="description" content="מצאו את נקודת החלפת הגז של סודהסטרים הקרובה אליכם">
  <meta name="theme-color" content="#0b5cab">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 data-i18n="title">החלפת גז סודהסטרים</h1>
    <button id="lang" class="chip" type="button" aria-label="Switch language">EN</button>
  </header>

  <div class="layout">
    <section class="panel">
      <div class="controls">
        <button id="locate" class="primary" type="button" data-i18n="locate">📍 מצא קרוב אליי</button>
        <input id="search" type="search" autocomplete="off" data-i18n-placeholder="search"
               placeholder="סינון לפי עיר, רשת או כתובת">
        <div id="radius" class="radius" role="group"></div>
        <p id="status" class="status" role="status" aria-live="polite"></p>
      </div>
      <ol id="list" class="list"></ol>
      <button id="more" class="more" type="button" hidden data-i18n="more">הצג עוד</button>
      <footer class="credits">
        <span data-i18n="source">נתונים: אתר סודהסטרים ישראל</span>
        · <a href="https://github.com/akivazev/sodastream-map" target="_blank" rel="noopener">GitHub</a>
      </footer>
    </section>
    <div id="map" class="map" role="region" aria-label="Map"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="app.js"></script>
</body>
</html>
